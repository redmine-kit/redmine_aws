# What Redmine Kit AWS adds to Redmine Kit's new UI (redmine_kit_ui's docs/plugins-kit.md, "The manifest"): the tab
# Status of Administration › AWS (AwsStatus, at the route of Redmine's tab), and the icon of the admin menu's item aws,
# which RedmineKit::Aws::Admin pushes in code. The other Redmine Kit AWS plugins add their tabs to the same page in their
# own manifests (a layout: admin screen with menu_item: aws, its tab and position, as their register_tab: docs/api.md),
# and their values to this tab as sections of rows (register_status_section), which this tab's JSON gives. Who may open
# it is the controllers' (require_admin).
api_version: 1
module: kit/aws.js
stylesheet: kit/aws.css
menus:
  admin_menu:
    aws: { icon: server }
screens:
  - { path: /admin/aws/status, component: AwsStatus, layout: admin, menu_item: aws, title: label_aws, tab: label_aws_status, position: 10 }
